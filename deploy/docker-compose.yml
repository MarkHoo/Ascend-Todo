services:
  mysql:
    image: mysql:8.4
    container_name: ascend-todo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ascend_todo
      MYSQL_USER: ascend
      MYSQL_PASSWORD: ascend_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ascend-todo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  server:
    build:
      context: ../server
    container_name: ascend-todo-server
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 11911
      DATABASE_URL: mysql://ascend:ascend_password@mysql:3306/ascend_todo
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-before-production
      SMTP_FROM: no-reply@ascendtodo.com
    ports:
      - "11911:11911"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: ascend-todo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

volumes:
  mysql-data:
  redis-data:
