name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). Leave empty to build only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: msi nsis
            args: ''
            label: Windows
          - os: macos-latest
            targets: dmg
            args: '--target universal-apple-darwin'
            label: macOS
          - os: ubuntu-22.04
            targets: deb appimage
            args: ''
            label: Ubuntu
          - os: ubuntu-22.04
            targets: rpm
            args: ''
            label: CentOS
          - os: ubuntu-22.04
            targets: appimage
            args: ''
            label: ArchLinux

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
          if [[ "${{ matrix.targets }}" == *"rpm"* ]]; then
            sudo apt-get install -y rpm
            mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          fi

      - name: Create placeholder for Windows-only resource
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/resources
          touch src-tauri/resources/WebView2Loader.dll

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{
              matrix.os == 'macos-latest'
              && 'aarch64-apple-darwin,x86_64-apple-darwin'
              || ''
            }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ inputs.tag || '' }}
          releaseName: 'Ascend Todo ${{ inputs.tag }}'
          releaseBody: |
            ## Ascend Todo / 光阶Todo ${{ inputs.tag }}
            > **Master your time, elevate your life.** / **拾光而上，有序人生。**

            ### Downloads / 下载

            | Platform | Package | Notes |
            | --- | --- | --- |
            | **Windows** | `.msi` or `-setup.exe` | NSIS auto-installs WebView2 Runtime |
            | **macOS** | `.dmg` | Universal — Intel + Apple Silicon |
            | **Ubuntu / Debian** | `_amd64.deb` | `sudo dpkg -i *.deb` |
            | **CentOS / RHEL / Fedora** | `.rpm` | `sudo rpm -i *.rpm` |
            | **Arch Linux** | `.AppImage` | Make executable then double-click |

            ### System Requirements / 系统要求

            - **Windows 10+** (WebView2 Runtime auto-installed by NSIS)
            - **macOS 11+**
            - **Linux**: GTK 3 + WebKitGTK 4.1 (Ubuntu 22+, Fedora 36+, Arch)
          releaseDraft: false
          prerelease: false
          args: '--bundles ${{ matrix.targets }} ${{ matrix.args }}'
